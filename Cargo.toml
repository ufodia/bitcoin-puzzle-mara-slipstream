[workspace]
members = [
    "crates/puzzle-slipstream-core",
    "apps/puzzle-slipstream-signer",
    "apps/puzzle-slipstream-relay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["PuzzleSlipstream contributors"]
repository = "https://github.com/ufodia/bitcoin-puzzle-mara-slipstream"
homepage = "https://github.com/ufodia/bitcoin-puzzle-mara-slipstream"
keywords = ["bitcoin", "p2pkh", "offline-signer", "slipstream", "rust"]
categories = ["cryptography::cryptocurrencies", "gui"]

[workspace.dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
bitcoin = { version = "0.32.7", features = ["serde"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hex = "0.4.3"
iced = { version = "0.13.1", features = ["tokio", "image"] }
image = { version = "0.25.5", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
rand = "0.8.5"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "time"] }
url = "2.5.4"
zeroize = { version = "1.8.1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
